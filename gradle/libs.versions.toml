# Catalogue de versions partagé par tous les projets ksuto (voir ksuto.settings)

[versions]
java = "25"
lombok = "1.18.48"
guice = "7.0.0"
guava = "33.7.2-jre"
slf4j = "2.0.20"
logback = "1.6.5"
flatlaf = "3.7.2"
junit = "6.1.3"
postgresql = "42.7.13"
commons-dbutils = "1.8.1"
jetbrains-annotations = "26.1.0"
commons-lang3 = "3.21.0"
foojay = "1.0.0"

# Projets ksuto (résolus depuis les sources via includeBuild)
ksuto-commons = "1.2"
ksuto-logger = "3.0"
ksuto-generator = "1.1"
ksuto-peripherals = "2.2.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
commons-dbutils = { module = "commons-dbutils:commons-dbutils", version.ref = "commons-dbutils" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }

ksuto-commons = { module = "fr.ksuto:commons", version.ref = "ksuto-commons" }
ksuto-logger = { module = "fr.ksuto:logger", version.ref = "ksuto-logger" }
ksuto-generator = { module = "fr.ksuto.bot:generator", version.ref = "ksuto-generator" }
ksuto-peripherals = { module = "fr.ksuto.bot:peripherals", version.ref = "ksuto-peripherals" }
